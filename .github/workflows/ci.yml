name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Exact pin: toolchain upgrades are a deliberate, reviewed change.
          bun-version: 1.4.3

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and types
        run: bun run check

      - name: Tests with coverage gate
        run: bun test
        env:
          PI_OFFLINE: "1"
